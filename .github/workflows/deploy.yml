name: Déploiement

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag GHCR à publier et déployer
        required: true
        default: latest
      deploy_mode:
        description: Mode de déploiement
        required: true
        type: choice
        default: push-only
        options:
          - push-only
          - ssh-geekom
      geekom_path:
        description: Dossier distant contenant docker-compose.geekom.yml et .env
        required: true
        default: /opt/privatelistings
      prune_images:
        description: Purger les anciennes images Docker après le déploiement SSH
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publier les images GHCR
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.images.outputs.image_tag }}
      web_image: ${{ steps.images.outputs.web_image }}
      worker_image: ${{ steps.images.outputs.worker_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Préparer les noms d'images
        id: images
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_.-]{1,128}$ ]]; then
            echo "::error::Le tag Docker doit contenir uniquement lettres, chiffres, points, tirets et underscores."
            exit 1
          fi

          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"

          {
            echo "image_tag=${IMAGE_TAG}"
            echo "short_sha=${short_sha}"
            echo "web_image=ghcr.io/${owner}/private-listings-web"
            echo "worker_image=ghcr.io/${owner}/private-listings-worker"
          } >> "$GITHUB_OUTPUT"

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Construire et publier l'image Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/PrivateListings.Web/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.web_image }}:${{ steps.images.outputs.image_tag }}
            ${{ steps.images.outputs.web_image }}:sha-${{ steps.images.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Construire et publier l'image Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/PrivateListings.Worker/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.worker_image }}:${{ steps.images.outputs.image_tag }}
            ${{ steps.images.outputs.worker_image }}:sha-${{ steps.images.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-ssh:
    name: Déployer sur le GEEKOM par SSH
    runs-on: ubuntu-latest
    needs: publish
    if: inputs.deploy_mode == 'ssh-geekom'

    steps:
      - name: Vérifier les secrets SSH
        shell: bash
        env:
          GEEKOM_HOST: ${{ secrets.GEEKOM_HOST }}
          GEEKOM_USER: ${{ secrets.GEEKOM_USER }}
          GEEKOM_SSH_KEY: ${{ secrets.GEEKOM_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${GEEKOM_HOST:?Le secret GEEKOM_HOST est requis.}"
          : "${GEEKOM_USER:?Le secret GEEKOM_USER est requis.}"
          : "${GEEKOM_SSH_KEY:?Le secret GEEKOM_SSH_KEY est requis.}"

      - name: Charger la clé SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GEEKOM_SSH_KEY }}

      - name: Préparer known_hosts
        shell: bash
        env:
          GEEKOM_HOST: ${{ secrets.GEEKOM_HOST }}
          GEEKOM_SSH_KNOWN_HOSTS: ${{ secrets.GEEKOM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          if [[ -n "$GEEKOM_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$GEEKOM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$GEEKOM_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Exécuter Docker Compose sur le GEEKOM
        shell: bash
        env:
          GEEKOM_HOST: ${{ secrets.GEEKOM_HOST }}
          GEEKOM_USER: ${{ secrets.GEEKOM_USER }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          GEEKOM_PATH: ${{ inputs.geekom_path }}
          PRUNE_IMAGES: ${{ inputs.prune_images }}
        run: |
          set -euo pipefail

          remote_path="$(printf '%q' "$GEEKOM_PATH")"
          image_tag="$(printf '%q' "$IMAGE_TAG")"

          remote_command="set -euo pipefail; cd ${remote_path}; export PRIVATE_LISTINGS_IMAGE_TAG=${image_tag}; docker compose --env-file .env -f docker-compose.geekom.yml pull; docker compose --env-file .env -f docker-compose.geekom.yml up -d --remove-orphans"

          if [[ "$PRUNE_IMAGES" == "true" ]]; then
            remote_command="${remote_command}; docker image prune -f"
          fi

          ssh "${GEEKOM_USER}@${GEEKOM_HOST}" "$remote_command"
